apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-app-deployment
  labels:
    app: mlops-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mlops-app
  template:
    metadata:
      labels:
        app: mlops-app
    spec:
      containers:
      - name: mlops-app
        # We will update this image name to your docker hub image once you push it
        image: mlops-app:latest
        # Set imagePullPolicy to Never or IfNotPresent for local testing if not pushed
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: mlops-app-service
spec:
  type: NodePort
  selector:
    app: mlops-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30007
